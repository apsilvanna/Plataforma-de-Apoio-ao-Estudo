<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de Apoio ao Estudo — Mini-Projeto PI</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header>
  <h1>Plataforma de Apoio ao Estudo</h1>
  <span id="status" class="badge">verificando backend…</span>
</header>
<main>
  <section class="card" id="perfis">
    <h2>Perfis</h2>
    <p id="perfil-discente"></p>
    <p id="perfil-resp"></p>
    <h3>Disciplinas</h3>
    <ul id="catalogo"></ul>
  </section>

  <section class="card">
    <h2>Nova sessão de estudo</h2>
    <label>Disciplina <select id="sel-disc"></select></label>
    <label>Modalidade <select id="sel-mod"></select></label>
    <label>Duração (min) <input id="inp-dur" type="number" min="1" value="25"></label>
    <div id="extras"></div>
    <button id="btn-reg">Registrar Estudo</button>
  </section>

  <section class="card">
    <h2>Meta semanal</h2>
    <div class="barra"><div id="barra"></div></div>
    <p id="pct"></p>
    <h3>Histórico desta sessão</h3>
    <ul id="lista"></ul>
    <label>Canal <select id="sel-not"></select></label>
    <button id="btn-not">Notificar Responsável</button>
  </section>

  <section class="card">
    <h2>Servidor (MySQL)</h2>
    <button id="btn-srv">Carregar Histórico do Servidor / Relatório</button>
    <p id="srv-resumo"></p>
    <ul id="srv-lista"></ul>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
